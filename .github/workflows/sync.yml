name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream (preserve local workflows)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git remote add upstream https://github.com/gchq/CyberChef.git
          git fetch upstream

          git checkout master

          # Save our workflows before the merge overwrites them
          git stash push -- .github/workflows

          # Merge upstream, preferring upstream for all conflicts
          git merge upstream/master --no-edit -X theirs

          # Restore our workflows only if we actually stashed something
          if git stash show 2>/dev/null; then
            git checkout stash -- .github/workflows
            git stash drop
          fi

          git add .github/workflows
          git commit -m "Sync upstream (preserving local workflows)" || echo "No changes to commit"
          git push
